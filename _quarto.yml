project:
  type: website
  output-dir: docs/
  resources:
    - "scripts/*.R"
  render:
    - "index.qmd"
    - "pages/modellierung_luftbild_lst.qmd"
    - "pages/qgis-howto-stadtwaerme-marburg.qmd"
    - "pages/exkurs_stationen.qmd"

website:
  title: "Modellieren in der Geographie"
  bread-crumbs: false
  open-graph: true
  page-navigation: true
  site-url: https://gisma-courses.github.io/geo-mar-mod-2026
  repo-url: https://github.com/gisma-courses/geo-mar-mod-2026
  repo-actions: [edit, issue]
  repo-branch: main

  search:
    location: navbar
    type: textbox

  twitter-card:
    creator: "@gisma"

  comments: false

  sidebar:
    - title: "Stadtwärme modellieren"
      style: "docked"
      collapse-level: 1
      pinned: true
      contents:
        - href: index.qmd
          text: Start
        - text: "---"
        - section: "Modellierung"
          contents:
            - href: pages/modellierung_luftbild_lst.qmd
              text: "Modellierung städtischer Hitze"
            - href: pages/exkurs_stationen.qmd
              text: "Exkurs: Messdaten und UTCI"
        - section: "Anleitung"
          contents:
            - href: pages/qgis-howto-stadtwaerme-marburg.qmd

execute:
  freeze: auto
  echo: false
  message: false
  warning: false
  cache: false

format:
  html:
    code-overflow: wrap
    toc-title: "Inhalt"
    number-sections: false
    highlight-style: github
    theme:
      light: cerulean
      dark: lumen
    code-copy: true
    toc: true
    link-external-icon: false
    link-external-newwindow: true
